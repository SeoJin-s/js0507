<script type="text/javascript">
	// 정보은닉, 캡슐화 
	class Member{
		#age; // private age
		constructor(name='guest', age=0){
			this.name = name;
			this.#age = age;
		}
		
		getAge() {	// public getter
			return this.#age;
		}
		getAge() {	// public getter
			this.#age = age;
		}
	}
	
	// let m1 = new Member(); // guest, 0
	let m2 = new Member('로빈', 27); // 로빈 ,27
	m2.name = 'Robin';
	m2.#Age = 25;
	alert(m2.name + m2.getAge());
	
	</script>
